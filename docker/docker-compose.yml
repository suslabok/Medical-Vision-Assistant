services:
  frontend:
    build:
      context: ../frontend
    container_name: mva_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
  backend:
    build:
      context: ../backend
    container_name: mva_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mva_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mva_password}
      POSTGRES_DB: ${POSTGRES_DB:-medical_vision_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ../backend:/app
      - ../ai-models:/app/ai-models

  postgres:
    image: postgres:16-alpine
    container_name: mva_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mva_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mva_password}
      POSTGRES_DB: ${POSTGRES_DB:-medical_vision_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
